[project]
name = "geohorun"
version = "0.1.0"
description = "Horun · PostRun · GeoHorun — módulo do Projeto Horun"
requires-python = ">=3.11"
# Versão EXATA, nunca faixa aberta (">="): o Dockerfile reinstala tudo do
# PyPI a cada `docker compose up --build`. Uma versão nova do SQLModel já
# derrubou o Horun Core em produção sem aviso. Para atualizar: mude aqui,
# rode a suíte, só então suba. (Mesmas versões do Horun Core.)
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlmodel==0.0.47",
    "pydantic==2.13.4",
    # PostRun: regressão das curvas e deconvolução (ajuste não linear) —
    # versões com pacote pronto para o Python 3.11 (servidor) e 3.14 (desenvolvimento)
    "numpy==2.3.4",
    "scipy==1.16.3",
    # relatórios e Estudos em Excel (lxml deixa o openpyxl ~3x mais rápido)
    "openpyxl==3.1.5",
    "lxml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]
# Fase 2: driver do PostgreSQL — só necessário na imagem Docker do
# servidor, não no desenvolvimento local (SQLite embutido no Python).
postgres = [
    "psycopg[binary]==3.3.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
