server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html,
    # deixando o router do frontend decidir a página no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Porta estreita do Agente Horun (exposta no host como 8003 — docker-compose.yml):
# o Agente roda no PC do Rock-Eval, fora da horun-network, e só pode chamar as
# 3 rotas dele (autenticadas pelo token do dispositivo, nunca pelos cabeçalhos
# de identidade do Core). Todo o resto cai no 404 — sem isso, alguém na rede do
# laboratório poderia forjar X-Horun-User-Id e se passar por qualquer usuário.
server {
    listen 8003;

    # um .B00 grande (ensaio cinético lento), em base64, passa fácil de 1 MB
    client_max_body_size 50m;

    location = /agent/enroll {
        proxy_pass http://geohorun-backend:8000/api/agent/enroll;
    }
    location = /agent/tasks {
        proxy_pass http://geohorun-backend:8000/api/agent/tasks;
    }
    location ~ ^/agent/tasks/[^/]+/result$ {
        rewrite ^/agent/(.*)$ /api/agent/$1 break;
        proxy_pass http://geohorun-backend:8000;
    }
    location / {
        return 404;
    }
}
